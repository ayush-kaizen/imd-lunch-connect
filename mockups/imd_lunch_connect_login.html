
<h2 class="sr-only">IMD Lunch Connect login screen mockup</h2>
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 2rem; min-height: 520px; display: flex; align-items: center; justify-content: center;">
  <div style="background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); width: 380px; padding: 2.5rem 2rem; text-align: center;">
    <div style="margin-bottom: 1.5rem;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: #00205B; border-radius: var(--border-radius-md); margin-bottom: 12px;">
        <span style="color: #fff; font-weight: 500; font-size: 14px; letter-spacing: 1px;">IMD</span>
      </div>
      <p style="font-size: 20px; font-weight: 500; margin: 0 0 4px;">Lunch Connect</p>
      <p style="font-size: 13px; color: var(--color-text-secondary); margin: 0;">Meet colleagues over lunch at the Hub</p>
    </div>
    <div style="text-align: left; margin-bottom: 12px;">
      <label style="font-size: 13px; color: var(--color-text-secondary); display: block; margin-bottom: 6px;">Email address</label>
      <input type="email" placeholder="firstname.lastname@imd.org" style="width: 100%; box-sizing: border-box;" />
    </div>
    <button style="width: 100%; background: #00205B; color: #fff; border: none; padding: 10px; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 16px;">Continue with email</button>
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
      <div style="flex: 1; height: 0.5px; background: var(--color-border-tertiary);"></div>
      <span style="font-size: 12px; color: var(--color-text-tertiary);">or</span>
      <div style="flex: 1; height: 0.5px; background: var(--color-border-tertiary);"></div>
    </div>
    <button style="width: 100%; margin-bottom: 0;"><i class="ti ti-mail" style="font-size: 16px; vertical-align: -2px; margin-right: 6px;" aria-hidden="true"></i>Sign in with magic link</button>
    <p style="font-size: 12px; color: var(--color-text-tertiary); margin: 16px 0 0;">By continuing, you agree to IMD's terms of use</p>
  </div>
</div>
